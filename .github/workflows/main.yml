name: Deploy to Firebase Hosting and Functions

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies for functions
        run: |
          cd functions
          npm install --engine-strict

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      - name: Set up Google Cloud credentials
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_CREDENTIALS_B64: ${{ secrets.GOOGLE_CREDENTIALS_B64 }}
        run: |
          set -euo pipefail
          CREDENTIALS_FILE="${{ github.workspace }}/service-account.json"

          if [ -n "${GOOGLE_CREDENTIALS_JSON:-}" ]; then
            printf '%s' "$GOOGLE_CREDENTIALS_JSON" > "$CREDENTIALS_FILE"
          elif [ -n "${GOOGLE_CREDENTIALS_B64:-}" ]; then
            printf '%s' "$GOOGLE_CREDENTIALS_B64" | base64 --decode > "$CREDENTIALS_FILE"
          else
            echo "Missing credentials secret. Set GOOGLE_CREDENTIALS (raw JSON) or GOOGLE_CREDENTIALS_B64 (base64 JSON)." >&2
            exit 1
          fi

          echo "GOOGLE_APPLICATION_CREDENTIALS=$CREDENTIALS_FILE" >> $GITHUB_ENV

      - name: Show Firebase CLI info (debugging)
        run: |
          set -x
          firebase --version
          wc -c "$GOOGLE_APPLICATION_CREDENTIALS"
          node -e "const fs=require('fs'); JSON.parse(fs.readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS,'utf8')); console.log('service-account-json-ok')"
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/service-account.json

      - name: Deploy to Firebase with logs
        run: |
          set -x
          firebase deploy --project=costam-3f612 --only hosting,functions:mobile --debug --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/service-account.json
          DEBUG: firebase:*
